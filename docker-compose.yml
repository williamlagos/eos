services:
  eos-base:
    build:
      context: .
      target: base
    image: eos:base
    container_name: eos-base
    ports:
      - "9460:9460"
    restart: unless-stopped

  eos-iot:
    build:
      context: .
      target: iot
    image: eos:iot
    container_name: eos-iot
    profiles:
      - iot
    ports:
      - "9461:9460"
    cap_add:
      - NET_ADMIN
    restart: unless-stopped

  eos-cloud:
    build:
      context: .
      target: cloud
    image: eos:cloud
    container_name: eos-cloud
    profiles:
      - cloud
    ports:
      - "8080:80"
      - "8000:8000"
      - "9462:9460"
    restart: unless-stopped

  eos-runtime:
    build:
      context: .
      target: runtime
    image: eos:runtime
    container_name: eos-runtime
    profiles:
      - runtime
    environment:
      SDL_VIDEODRIVER: "${SDL_VIDEODRIVER:-dummy}"
      SDL_AUDIODRIVER: "${SDL_AUDIODRIVER:-dummy}"
    ports:
      - "9463:9460"
    restart: unless-stopped

  eos-sdk:
    build:
      context: .
      target: sdk
    image: eos:sdk
    container_name: eos-sdk
    profiles:
      - sdk
    environment:
      SDL_VIDEODRIVER: "${SDL_VIDEODRIVER:-dummy}"
      SDL_AUDIODRIVER: "${SDL_AUDIODRIVER:-dummy}"
    ports:
      - "9464:9460"
    restart: unless-stopped
