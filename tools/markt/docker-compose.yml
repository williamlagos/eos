services:
  db:
    image: mariadb:11
    container_name: wordpress_db
    restart: unless-stopped
    volumes:
      - database:/var/lib/mysql
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-somewordpress}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-wordpress}
      MARIADB_USER: ${MARIADB_USER:-wordpress}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-wordpress}

  wordpress:
    depends_on:
      - db
    image: wordpress:latest
    container_name: wordpress
    restart: unless-stopped
    volumes:
      - /var/www/public/:/var/www/html/
    environment:
      VIRTUAL_HOST: "${VIRTUAL_HOST:-.derhut.com.br,.portal25.com}"
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${MARIADB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${MARIADB_PASSWORD:-wordpress}
      WORDPRESS_DB_NAME: ${MARIADB_DATABASE:-wordpress}

volumes:
  database:

networks:
  default:
    name: efforia
    external: true
